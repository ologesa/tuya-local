name: Heat recovery ventilator
products:
  - id: 7bsjlfbavgbyia6b
    model: NBSVT150-PLUS
entities:
  - entity: fan
    translation_key: ventilation
    dps:
      - id: 1
        type: boolean
        name: switch
      # The app slider goes 0-3, but only 1-3 have been confirmed.
      - id: 101
        type: integer
        name: speed
        range:
          min: 1
          max: 3
      # Function unknown, always observed as true.
      - id: 112
        type: boolean
        name: unknown_112
      - id: 113
        type: boolean
        name: unknown_113
  # 102, 103 and 104 are mutually exclusive; the device switches the
  # others off when one is turned on.
  - entity: switch
    name: Supply only
    icon: "mdi:home-import-outline"
    dps:
      - id: 102
        type: boolean
        name: switch
  - entity: switch
    name: Exhaust only
    icon: "mdi:home-export-outline"
    dps:
      - id: 103
        type: boolean
        name: switch
  - entity: switch
    name: Heat recovery
    icon: "mdi:swap-horizontal"
    dps:
      - id: 104
        type: boolean
        name: switch
  # Auto and night mode are mutually exclusive.
  - entity: switch
    name: Auto mode
    icon: "mdi:fan-auto"
    dps:
      - id: 105
        type: boolean
        name: switch
  # Button with a filter-like icon in the app, exact function unknown.
  - entity: switch
    name: Air treatment
    icon: "mdi:air-filter"
    dps:
      - id: 106
        type: boolean
        name: switch
  - entity: switch
    translation_key: night_mode
    dps:
      - id: 111
        type: boolean
        name: switch
